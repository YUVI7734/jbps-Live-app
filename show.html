<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Light Show - Ullas 2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            overflow: hidden; background-color: #050505; color: white; 
            font-family: 'Poppins', sans-serif; transition: background 0.1s ease;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }

        /* --- BACKGROUND MEDIA (Normal Mode) --- */
        #bgVideo {
            position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
            width: auto; height: auto; z-index: 1; transform: translateX(-50%) translateY(-50%);
            object-fit: cover; display: none;
        }

        /* --- UI OVERLAY --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none; /* Clicks pass through */
        }
        
        /* Brightness Prompt */
        #brightnessPrompt {
            background: rgba(241, 196, 15, 0.9); color: black; padding: 15px 30px;
            border-radius: 30px; font-weight: bold; text-align: center; font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px;
            animation: slideDownFade 3s forwards;
        }
        @keyframes slideDownFade {
            0% { transform: translateY(-50px); opacity: 0; }
            10% { transform: translateY(0); opacity: 1; }
            90% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; display: none; }
        }

        .ullas-watermark {
            font-family: 'Orbitron', sans-serif; font-size: 40px; opacity: 0.3;
            text-shadow: 0 0 20px rgba(255,255,255,0.5); margin-bottom: 10px; text-transform: uppercase;
        }
        .act-name {
            font-size: 18px; font-weight: bold; opacity: 0.6; letter-spacing: 2px; 
            text-transform: uppercase; text-align: center; padding: 0 20px;
        }

        /* --- DJ EFFECTS (CSS Classes) --- */
        .fx-pulse { animation: pulseEffect 1s infinite alternate; }
        .fx-tiranga { background: linear-gradient(90deg, #ff9933, #ffffff, #138808) !important; color: black; }
        .fx-strobe { animation: coloredStrobe 0.08s infinite !important; }
        .fx-multi-strobe { animation: multiStrobe 0.08s infinite !important; }
        .fx-jbs-strobe { animation: jbsFlash 0.1s infinite !important; }

        @keyframes coloredStrobe { 0%, 100% { background-color: var(--strobe-color); color: #000; } 50% { background-color: #000; color: #fff; } }
        @keyframes multiStrobe { 0% {background: red;} 33% {background: blue;} 66% {background: green;} 100% {background: red;} }
        @keyframes jbsFlash {
            0%, 100% { background: url('logo.png') center/contain no-repeat, #ffcc00 !important; }
            50% { background: url('logo.png') center/contain no-repeat, #000 !important; }
        }
        @keyframes pulseEffect { 0% { filter: brightness(0.8); } 100% { filter: brightness(1.5); box-shadow: inset 0 0 100px rgba(255,255,255,0.8); } }

        /* --- MAGIC TOUCH (MASALA) --- */
        .particle {
            position: absolute; width: 15px; height: 15px; background: white; border-radius: 50%; 
            pointer-events: none; box-shadow: 0 0 15px white, 0 0 30px #f1c40f;
            animation: fadeOutUp 1s ease-out forwards; z-index: 5;
        }
        @keyframes fadeOutUp { 0% { transform: scale(1) translateY(0); opacity: 1; } 100% { transform: scale(0) translateY(-50px); opacity: 0; } }
    </style>
</head>
<body>

    <!-- Background Video for Normal Mode -->
    <video id="bgVideo" autoplay loop muted playsinline></video>

    <!-- UI Overlay -->
    <div class="overlay" id="uiOverlay">
        <div id="brightnessPrompt">☀️ PLEASE TURN YOUR BRIGHTNESS TO MAXIMUM!</div>
        
        <div class="ullas-watermark">ULLAS 2.0</div>
        <div class="act-name" id="displayActName">Loading Stage...</div>
        <p style="font-size: 11px; opacity: 0.3; margin-top: 50px;">Touch screen for magic ✨</p>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // BHAII APNI FIREBASE CONFIG DAAL DE
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09",
            storageBucket: "jbps-voting-app-64e09.firebasestorage.app",
            messagingSenderId: "21759156292",
            appId: "1:21759156292:web:9387c446af3e5740efdc11"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentActData = {};
        let wakeLock = null;

        // --- 1. KEEP SCREEN AWAKE (WAKE LOCK API) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock is active');
                }
            } catch (err) { console.error(`Wake Lock error: ${err.name}, ${err.message}`); }
        }
        document.addEventListener('click', requestWakeLock, { once: true }); // Requires user interaction

        // Remove brightness prompt after 4 seconds
        setTimeout(() => { document.getElementById('brightnessPrompt').style.display = 'none'; }, 4000);


        // --- 2. LISTEN FOR CURRENT ACT (Name & Media) ---
        database.ref('current_act').on('value', (snap) => {
            const act = snap.val();
            if(act && act.status === 'live') {
                currentActData = act;
                document.getElementById('displayActName').innerText = act.name;
            } else {
                window.location.href = "engage.html"; // Act ended, kick back to lobby
            }
        });


        // --- 3. THE MAGIC: LISTEN FOR DJ LIGHTING CONTROLS ---
        database.ref('audience_fx').on('value', (snap) => {
            const fx = snap.val();
            if(!fx) return;

            const body = document.body;
            const videoEl = document.getElementById('bgVideo');

            // Reset Everything First
            body.className = ''; 
            body.style.background = '#000';
            body.style.color = 'white';
            videoEl.style.display = 'none';
            videoEl.pause();

            // Apply DJ Command
            if (fx.type === 'normal') {
                // Show uploaded act media (Image or Video)
                if(currentActData.mediaType === 'video' && currentActData.mediaData) {
                    videoEl.src = currentActData.mediaData;
                    videoEl.style.display = 'block';
                    videoEl.play().catch(e => console.log("Autoplay prevented"));
                } else if (currentActData.mediaData) {
                    body.style.background = `url(${currentActData.mediaData}) center/cover no-repeat, #000`;
                } else {
                    body.style.background = '#050505'; // Fallback dark
                }
            } 
            else if (fx.type === 'solid') {
                body.style.background = fx.color;
            } 
            else if (fx.type === 'pulse') {
                body.style.background = fx.color;
                body.classList.add('fx-pulse');
            } 
            else if (fx.type === 'strobe') {
                body.style.setProperty('--strobe-color', fx.color);
                body.classList.add('fx-strobe');
            }
            else if (fx.type === 'multi_strobe') {
                body.classList.add('fx-multi-strobe');
            }
            else if (fx.type === 'tiranga') {
                body.classList.add('fx-tiranga');
                body.style.color = 'black';
            } 
            else if (fx.type === 'jbs_logo') {
                body.style.background = 'url("logo.png") center/contain no-repeat, radial-gradient(circle, #ffcc00 0%, #332200 100%)';
            }
            else if (fx.type === 'jbs_strobe') {
                body.classList.add('fx-jbs-strobe');
            }
        });

        // --- 4. THE "MASALA" (Touch Particles) ---
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = (x - 7.5) + 'px'; 
            particle.style.top = (y - 7.5) + 'px';
            document.body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 1000);
        }
        document.addEventListener('pointermove', (e) => {
            if(e.buttons > 0) createParticle(e.clientX, e.clientY);
        });
        document.addEventListener('pointerdown', (e) => {
            createParticle(e.clientX, e.clientY);
        });

    </script>
</body>
</html>
