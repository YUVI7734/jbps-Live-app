<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Light Show - Ullas 2.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100vh;
            overflow: hidden; /* No scrolling */
            background-color: #050505;
            color: white; font-family: 'Poppins', sans-serif;
            transition: background 0.5s ease-in-out;
            user-select: none; -webkit-user-select: none;
            touch-action: none; /* Prevents pull-to-refresh on mobile */
        }

        /* --- UI OVERLAY (Text) --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none; /* Clicks screen par pass hone dega */
        }

        .ullas-watermark {
            font-family: 'Yatra One', serif; font-size: 50px;
            opacity: 0.3; /* Faded so it doesn't distract from lights */
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }

        .act-name {
            font-size: 20px; font-weight: bold; opacity: 0.5;
            letter-spacing: 2px; text-transform: uppercase; text-align: center;
            padding: 0 20px;
        }

        /* --- FX CSS CLASSES (Controlled by Firebase) --- */
        .fx-tiranga {
            background: linear-gradient(to right, #ff9933, #ffffff, #138808) !important;
            color: black;
        }
        
        .fx-strobe {
            animation: strobeEffect 0.1s infinite;
        }
        
        .fx-pulse {
            animation: pulseEffect 1s infinite alternate;
        }

        @keyframes strobeEffect {
            0%, 100% { background-color: white; color: black; }
            50% { background-color: black; color: white; }
        }

        @keyframes pulseEffect {
            0% { filter: brightness(1); box-shadow: inset 0 0 0px rgba(255,255,255,0); }
            100% { filter: brightness(1.5); box-shadow: inset 0 0 100px rgba(255,255,255,0.8); }
        }

        /* --- MAGIC TOUCH PARTICLES (Masala) --- */
        .particle {
            position: absolute; width: 15px; height: 15px;
            background: white; border-radius: 50%; pointer-events: none;
            box-shadow: 0 0 15px white, 0 0 30px #f1c40f;
            animation: fadeOutUp 1s ease-out forwards;
            z-index: 5;
        }
        @keyframes fadeOutUp {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0) translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Center text (Visible Directly) -->
    <div class="overlay" id="uiOverlay">
        <div id="textOverlay" style="display: flex; flex-direction: column; align-items: center;">
            <div class="ullas-watermark">उल्लास 2.0</div>
            <div class="act-name" id="displayActName">Loading Act...</div>
            <p style="font-size: 12px; opacity: 0.3; margin-top: 50px;">Touch screen for magic ✨</p>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // BHAII YAHAN APNI FIREBASE CONFIG DAALNA 
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09",
            storageBucket: "jbps-voting-app-64e09.firebasestorage.app",
            messagingSenderId: "21759156292",
            appId: "1:21759156292:web:9387c446af3e5740efdc11"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- FIREBASE: LISTEN FOR DJ FX CONTROLS ---
        database.ref('audience_fx').on('value', (snap) => {
            const fx = snap.val();
            if(!fx) return;

            const body = document.body;
            // Remove previous classes and inline styles
            body.className = ''; 
            body.style.background = '';

            if (fx.type === 'solid') {
                body.style.background = fx.color;
            } 
            else if (fx.type === 'pulse') {
                body.style.background = fx.color;
                body.classList.add('fx-pulse');
            } 
            else if (fx.type === 'tiranga') {
                body.classList.add('fx-tiranga');
            } 
            else if (fx.type === 'strobe') {
                body.classList.add('fx-strobe');
            }
        });

        // --- FIREBASE: ACT STATUS ---
        database.ref('current_act').on('value', (snap) => {
            const act = snap.val();
            if(act && act.status === 'live') {
                document.getElementById('displayActName').innerText = act.name;
            } else {
                // Agar admin act end kar de, toh wapas engage.html par bhej do
                window.location.href = "engage.html";
            }
        });

        // --- THE "MASALA" (Interactive Touch Particles) ---
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = (x - 7.5) + 'px'; 
            particle.style.top = (y - 7.5) + 'px';
            document.body.appendChild(particle);
            
            setTimeout(() => { particle.remove(); }, 1000);
        }

        document.addEventListener('pointermove', (e) => {
            if(e.buttons > 0) createParticle(e.clientX, e.clientY);
        });
        document.addEventListener('pointerdown', (e) => {
            createParticle(e.clientX, e.clientY);
        });

    </script>
</body>
  </html>
