<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Performance</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Firebase Scripts (Yeh jaan hai is page ki) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #000000 100%);
            color: white; font-family: 'Poppins', sans-serif;
            height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }
        .school-header {
            display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%;
            margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .header-logo { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); object-fit: cover; }
        .header-school-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #d4af37; text-transform: uppercase; text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2); }
        .top-nav { width: 100%; display: flex; justify-content: flex-start; margin-bottom: 20px; }
        .back-btn { color: #94a3b8; text-decoration: none; font-size: 1rem; font-weight: 600; }
        
        .act-focus { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 20px; padding: 20px; text-align: center; width: 100%; box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
        .dp-circle { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #d4af37; margin-bottom: 10px; }
        .act-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #d4af37; margin-bottom: 5px; }
        
        .rating-text { margin: 30px 0 15px; font-size: 1.1rem; color: #cbd5e1; text-align: center; }
        .rating-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 40px; }
        .rate-btn { width: 50px; height: 50px; border-radius: 50%; background: #1e293b; color: white; border: 1px solid #334155; font-size: 1.2rem; font-weight: 600; cursor: pointer; transition: 0.3s all; }
        .rate-btn.selected { background: #d4af37; color: black; border: none; transform: scale(1.15); box-shadow: 0 0 15px #d4af37; }
        
        .submit-btn { padding: 15px 40px; font-size: 1.2rem; font-weight: 600; color: black; background: linear-gradient(45deg, #d4af37, #f3e5ab); border: none; border-radius: 30px; cursor: pointer; opacity: 0.5; pointer-events: none; transition: 0.3s; }
        .submit-btn.active { opacity: 1; pointer-events: auto; box-shadow: 0px 10px 30px rgba(212, 175, 55, 0.3); }

        #success-msg { display: none; text-align: center; margin-top: 40px; }
        .check-icon { font-size: 4rem; color: #10b981; margin-bottom: 10px; animation: popIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <!-- Premium Header -->
    <div class="school-header">
        <img src="logo.png" alt="JBS Logo" class="header-logo">
        <h2 class="header-school-name">Jingle Bells<br>Public School</h2>
    </div>
    <div class="top-nav"><a href="index.html" class="back-btn">← Back to Feed</a></div>

    <!-- Act Details Box -->
    <div class="act-focus" id="voting-area">
        <img src="https://i.pravatar.cc/150?img=11" alt="DP" class="dp-circle">
        <div class="act-title" id="actTitle">Connecting to Stage...</div>
        <p style="color: #94a3b8; font-size: 0.9rem;" id="actGroup">Please wait for next act</p>
    </div>

    <!-- Rating Buttons -->
    <div id="rating-section" style="display: flex; flex-direction: column; align-items: center;">
        <div class="rating-text">Tap to rate out of 10</div>
        <div class="rating-grid" id="grid"></div>
        <button class="submit-btn" id="submitBtn" onclick="submitVote()">Submit Vote</button>
    </div>

    <!-- Success Message -->
    <div id="success-msg">
        <div class="check-icon">✓</div>
        <h2 style="color: #d4af37; font-family: 'Playfair Display', serif;">Vote Locked In!</h2>
        <p style="color: #cbd5e1; margin-top: 10px;">Thank you for rating. Please enjoy the performance.</p>
    </div>

    <script>
        // Yahan tera asli Firebase Database link hai
        const firebaseConfig = { 
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentActName = "";
        const grid = document.getElementById('grid');
        const submitBtn = document.getElementById('submitBtn');
        let selectedValue = 0;

        // Generate 1 to 10 Buttons
        for(let i = 1; i <= 10; i++) {
            let btn = document.createElement('button');
            btn.className = 'rate-btn';
            btn.innerText = i;
            btn.onclick = function() {
                document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                selectedValue = i;
                submitBtn.classList.add('active');
            };
            grid.appendChild(btn);
        }

        // Live Act Listener - Admin phone se data automatically yahan aayega
        db.ref('currentAct').on('value', (snapshot) => {
            let act = snapshot.val();
            if(act && act.name) {
                document.getElementById('actTitle').innerText = act.name;
                document.getElementById('actGroup').innerText = act.group;
                currentActName = act.name;

                // Anti-Cheat: Agar phone mein pehle se is act ka vote save hai
                if(localStorage.getItem('votedFor_' + currentActName)) {
                    document.getElementById('voting-area').style.display = 'block';
                    document.getElementById('rating-section').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'block';
                } else {
                    // Naya act lagte hi voting dobara khul jayegi
                    document.getElementById('voting-area').style.display = 'block';
                    document.getElementById('rating-section').style.display = 'flex';
                    document.getElementById('success-msg').style.display = 'none';
                    
                    document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('selected'));
                    submitBtn.classList.remove('active');
                    selectedValue = 0;
                }
            }
        });

        // Vote Submit karna
        function submitVote() {
            if(selectedValue === 0) return;
            
            // Firebase mein vote bhejo
            db.ref('currentVotes').push(selectedValue);
            
            // Phone memory mein lock laga do taaki dubara vote na kar paye
            localStorage.setItem('votedFor_' + currentActName, 'true');

            // Success screen dikhao
            document.getElementById('rating-section').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>
</body>
  </html>
