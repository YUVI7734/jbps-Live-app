<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Stage Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { background: #000000; color: white; font-family: 'Poppins', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; text-align: center; }
        .bg-glow { position: absolute; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(0,0,0,1) 80%); z-index: 0; }
        
        #waiting-state { z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .waiting-text { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 4rem); color: #10b981; opacity: 0.5; margin-top: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px #10b981; } }

        #result-state { display: none; z-index: 1; width: 100%; padding: 20px; }
        .act-name-big { font-size: clamp(1.8rem, 4vw, 4rem); color: white; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        .bar-container { width: clamp(60px, 10vw, 100px); height: clamp(250px, 40vh, 400px); background: #0f172a; border-radius: 50px; margin: 0 auto; position: relative; overflow: hidden; border: 2px solid #1e293b; box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 30px rgba(16, 185, 129, 0.2); }
        .bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(0deg, #059669, #34d399); border-radius: 50px; transition: height 0.1s linear; box-shadow: 0 0 25px rgba(52, 211, 153, 0.8); }

        .score-display { font-size: clamp(4rem, 12vw, 8rem); font-weight: 800; color: #ffffff; margin-top: 20px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .locked-in { color: #34d399; text-shadow: 0 0 40px #34d399, 0 0 80px #10b981; transform: scale(1.1); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div id="waiting-state">
        <img src="logo.png" alt="JBS Logo" style="width: clamp(100px, 15vw, 150px); border-radius:50%; box-shadow: 0 0 30px rgba(16,185,129,0.4);">
        <div class="waiting-text">Audience Polling Active...</div>
    </div>

    <div id="result-state">
        <div class="act-name-big" id="bigActName">Loading...</div>
        <div class="bar-container"><div class="bar-fill" id="scoreBar"></div></div>
        <div class="score-display" id="finalScore">0.0</div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let liveAverage = 0.0;
        let isAnimating = false;

        // Listen for Act Name
        db.ref('currentAct').on('value', (snap) => {
            if(snap.val() && snap.val().name) {
                document.getElementById('bigActName').innerText = snap.val().name;
            }
        });

        // Calc Average silently in background
        db.ref('currentVotes').on('value', (snap) => {
            let data = snap.val();
            if(data) {
                let votes = Object.values(data);
                let sum = votes.reduce((a, b) => a + b, 0);
                liveAverage = (sum / votes.length).toFixed(1);
            } else {
                liveAverage = 0.0;
            }
        });

        // Trigger animation when Admin hits "Flash Results"
        db.ref('screenState').on('value', (snap) => {
            let state = snap.val();
            if(state && state.action === 'showResult' && !isAnimating) {
                isAnimating = true;
                startSuspenseAnimation(liveAverage);
            } else if (state && state.action === 'waiting') {
                isAnimating = false;
                document.getElementById('waiting-state').style.display = 'flex';
                document.getElementById('result-state').style.display = 'none';
                
                // Reset UI classes for next time
                document.getElementById('scoreBar').style.transition = 'height 0.1s linear';
                document.getElementById('scoreBar').style.height = '0%';
                document.getElementById('finalScore').classList.remove('locked-in');
            }
        });

        function startSuspenseAnimation(realScore) {
            document.getElementById('waiting-state').style.display = 'none';
            document.getElementById('result-state').style.display = 'block';

            let bar = document.getElementById('scoreBar');
            let scoreText = document.getElementById('finalScore');
            let suspenseInterval = setInterval(() => {
                scoreText.innerText = (Math.random() * 8.9 + 1.0).toFixed(1);
                bar.style.height = (Math.floor(Math.random() * 85) + 10) + '%';
            }, 100);

            setTimeout(() => {
                clearInterval(suspenseInterval);
                bar.style.transition = "height 1s cubic-bezier(0.1, 0.8, 0.2, 1)";
                bar.style.height = (realScore / 10 * 100) + '%';
                scoreText.innerText = realScore + " / 10";
                scoreText.classList.add('locked-in');
            }, 3500); // 3.5 sec suspense
        }
    </script>
</body>
</html>
