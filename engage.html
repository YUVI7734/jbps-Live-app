<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audience Engagement - Ullas 2.0</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dark-bg: #0b132b;
            --gold: #f1c40f;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; 
        }

        /* Modals & Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(11, 19, 43, 0.9), rgba(0, 0, 0, 0.95));
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(241, 196, 15, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 15px rgba(241, 196, 15, 0.1);
        }

        .modal-title {
            color: var(--gold);
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .modal-text {
            font-size: 15px;
            color: #dcdde1;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-gold {
            background: linear-gradient(90deg, #d4af37, #f1c40f);
            color: black;
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.4);
            transition: transform 0.2s;
        }

        .btn-gold:active { transform: scale(0.95); }

        /* Main Screen Elements */
        #mainScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding-top: 30px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        .header-title {
            color: var(--gold);
            font-size: 28px;
            font-family: serif;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(241, 196, 15, 0.3);
            padding-bottom: 10px;
            width: 90%;
            text-align: center;
        }

        /* --- CLASSY LIVE BOX CSS --- */
        .live-card-container {
            position: relative;
            width: 90%;
            max-width: 450px;
            display: none; /* Will be shown via JS when an act is live */
            margin-top: 20px;
        }

        .live-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: #ff4757;
            color: white;
            padding: 5px 15px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.6);
            z-index: 10;
            animation: pulseRed 1.5s infinite;
        }

        .classy-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(241, 196, 15, 0.5); /* Gold outline */
            border-radius: 25px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-pic {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            background: #222;
        }

        .perf-details {
            flex-grow: 1;
            text-align: left;
        }

        .perf-name {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            color: white;
        }

        .perf-class {
            font-size: 13px;
            color: #bdc3c7;
            margin: 5px 0 0 0;
        }

        .action-btn {
            background: var(--gold);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .action-btn:active { transform: scale(0.95); }

        .waiting-text {
            color: #7f8fa6;
            font-size: 16px;
            text-align: center;
            margin-top: 50px;
            font-style: italic;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
    </style>
</head>
<body>

    <!-- Language Selection Modal -->
    <div id="languageModal" class="modal-overlay">
        <div class="glass-card">
            <h2 class="modal-title">Choose Your Language</h2>
            <div class="btn-group">
                <button class="btn-gold" onclick="selectLanguage('en')">English</button>
                <button class="btn-gold" onclick="selectLanguage('hi')" style="font-family: 'Yatra One', serif; font-size: 20px;">हिंदी</button>
            </div>
        </div>
    </div>

    <!-- Disclaimer Modal -->
    <div id="disclaimerModal" class="modal-overlay" style="display: none;">
        <div class="glass-card">
            <h2 class="modal-title" id="discTitle">Important Note</h2>
            <p class="modal-text" id="discText">
                Dear Parents, you are requested to click on the options during live shows to encourage our students and show your participation.
            </p>
            <button class="btn-gold" onclick="enterMainScreen()" id="discBtn">I Agree & Enter</button>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="mainScreen">
        <h2 class="header-title">Live Performances</h2>

        <!-- CLASSY BOX (Hidden until Admin triggers a live act) -->
        <div class="live-card-container" id="liveContainer">
            <div class="live-badge">LIVE NOW</div>
            <div class="classy-box">
                <!-- Circular Image -->
                <img src="" alt="Performance Image" class="profile-pic" id="livePic">
                
                <!-- Text Details -->
                <div class="perf-details">
                    <h3 class="perf-name" id="liveName">Act Name</h3>
                    <p class="perf-class" id="liveClass">Class Details</p>
                </div>
                
                <!-- Button redirecting to show.html -->
                <button class="action-btn" onclick="window.location.href='show.html'">Join ✨</button>
            </div>
        </div>

        <!-- Waiting Message (Shows when no act is live) -->
        <p class="waiting-text" id="waitingMsg">Waiting for the next act to begin...</p>

    </div>

    <!-- Firebase SDK Setup -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDdluLR3iRPThrHJgl4Ag-3sCUtWqjeNiA",
            authDomain: "jbps-voting-app-64e09.firebaseapp.com",
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com",
            projectId: "jbps-voting-app-64e09",
            storageBucket: "jbps-voting-app-64e09.firebasestorage.app",
            messagingSenderId: "21759156292",
            appId: "1:21759156292:web:9387c446af3e5740efdc11"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const texts = {
            en: {
                title: "Welcome Parents",
                body: "Dear Parents, you are requested to interact with the screen during live shows to encourage our students and illuminate the arena.",
                btn: "Enter Show ✨"
            },
            hi: {
                title: "अभिभावकों का स्वागत है",
                body: "प्रिय अभिभावकों, आपसे अनुरोध है कि लाइव प्रदर्शन के दौरान छात्रों का उत्साह बढ़ाने और प्रांगण को रोशन करने के लिए स्क्रीन के विकल्पों का उपयोग करें।",
                btn: "प्रवेश करें ✨"
            }
        };

        function selectLanguage(lang) {
            document.getElementById('languageModal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('languageModal').style.display = 'none';
                document.getElementById('discTitle').innerText = texts[lang].title;
                document.getElementById('discText').innerText = texts[lang].body;
                document.getElementById('discBtn').innerText = texts[lang].btn;
                
                document.getElementById('disclaimerModal').style.display = 'flex';
                document.getElementById('disclaimerModal').style.opacity = '1';
            }, 500);
        }

        function enterMainScreen() {
            document.getElementById('disclaimerModal').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('disclaimerModal').style.display = 'none';
                document.body.style.overflow = 'auto'; 
                document.getElementById('mainScreen').style.display = 'flex';
            }, 500);
        }

        // Firebase Listener for updating the Classy Box
        database.ref('current_act').on('value', (snapshot) => {
            const data = snapshot.val();
            const liveContainer = document.getElementById('liveContainer');
            const waitingMsg = document.getElementById('waitingMsg');

            if(data && data.status === "live") {
                // Populate the box with Admin's data
                document.getElementById('liveName').innerText = data.name;
                document.getElementById('liveClass').innerText = data.class || "";
                
                // Set image (fallback to a transparent/blank if no custom pic)
                const picElement = document.getElementById('livePic');
                if(data.pic) {
                    picElement.src = data.pic;
                    picElement.style.display = 'block';
                } else {
                    picElement.src = ""; // Clear if empty
                    picElement.style.display = 'none'; // Hide empty circle
                }
                
                // Switch UI from "Waiting" to "Live Box"
                liveContainer.style.display = 'block';
                waitingMsg.style.display = 'none';
            } else {
                // Hide box, show waiting message
                liveContainer.style.display = 'none';
                waitingMsg.style.display = 'block';
            }
        });

    </script>
</body>
    </html>
