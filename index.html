<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBS Annual Function 2026</title>
    
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Firebase Scripts (Yeh missing tha!) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000000; color: white; font-family: 'Poppins', sans-serif; overflow: hidden; }

        /* ================= ZEE5 STYLE INTRO ================= */
        #splash-screen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; z-index: 10; transition: opacity 1s ease-in-out; }
        .zee-logo { font-family: 'Playfair Display', serif; font-size: 5rem; font-weight: 700; letter-spacing: 5px; margin-bottom: 5px; background: linear-gradient(90deg, #111 0%, #fff 20%, #ff007f 40%, #00f0ff 60%, #fff 80%, #111 100%); background-size: 200% auto; color: #000; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: zeeSweep 3.5s ease-in-out forwards; opacity: 0; transform: scale(0.9); }
        @keyframes zeeSweep { 0% { background-position: 200% center; opacity: 0; transform: scale(0.9); } 10% { opacity: 1; transform: scale(1); } 70% { background-position: -200% center; } 100% { background-position: -200% center; opacity: 1; transform: scale(1); -webkit-text-fill-color: #ffffff; text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.5); } }
        .flow-text { opacity: 0; transform: translateY(20px); animation: fadeInUp 1s ease forwards; }
        .presents { font-size: 1.1rem; color: #94a3b8; font-style: italic; animation-delay: 2.5s; }
        .awaited { font-size: 1.2rem; color: #cbd5e1; margin-top: 30px; animation-delay: 3s; }
        .event-name { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #d4af37; text-shadow: 0px 4px 20px rgba(212, 175, 55, 0.4); margin-top: 5px; animation-delay: 3.5s; }
        .enter-btn { margin-top: 40px; padding: 12px 40px; font-size: 1.2rem; font-weight: 600; color: #000; background: linear-gradient(45deg, #d4af37, #f3e5ab); border: none; border-radius: 30px; cursor: pointer; opacity: 0; transform: translateY(20px); animation: fadeInUp 1s ease forwards; animation-delay: 4.2s; box-shadow: 0px 10px 30px rgba(212, 175, 55, 0.3); transition: 0.3s; }
        .enter-btn:active { transform: scale(0.95); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* ================= LIVE FEED SCREEN ================= */
        #main-feed { display: none; height: 100vh; overflow-y: auto; padding: 20px; opacity: 0; transition: opacity 1s ease-in-out; background: #0f172a; }
        .feed-header { font-family: 'Playfair Display', serif; color: #d4af37; text-align: center; font-size: 1.8rem; margin-bottom: 30px; margin-top: 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 10px; }
        
        .act-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; position: relative; }
        .act-card.active { border: 1px solid rgba(212, 175, 55, 0.5); box-shadow: 0 0 20px rgba(212, 175, 55, 0.15); }
        .dp-circle { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #d4af37; }
        .act-details { flex: 1; }
        .act-title { font-size: 1.1rem; font-weight: 600; color: white; margin-bottom: 5px; }
        .act-group { font-size: 0.85rem; color: #94a3b8; }
        
        .live-badge { background: #ef4444; color: white; font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; position: absolute; top: -10px; right: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        .vote-now-btn { background: #d4af37; color: black; border: none; padding: 8px 15px; border-radius: 15px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. ZEE5 STYLE INTRO -->
    <div id="splash-screen">
        <h1 class="zee-logo">JBS</h1>
        <p class="flow-text presents">presents</p>
        <h2 class="flow-text awaited">The most awaited</h2>
        <h1 class="flow-text event-name">Annual Function 2026</h1>
        <button class="enter-btn" onclick="openFeed()">Enter to Vote</button>
    </div>

    <!-- 2. LIVE ACT FEED -->
    <div id="main-feed">
        <h2 class="feed-header">Live Performances</h2>

        <!-- DYNAMIC ACTIVE ACT CARD -->
        <div class="act-card active" id="liveActCard">
            <span class="live-badge">LIVE NOW</span>
            <img src="https://i.pravatar.cc/150?img=11" alt="DP" class="dp-circle">
            <div class="act-details">
                <div class="act-title" id="feedActTitle">Waiting for act...</div>
                <div class="act-group" id="feedActGroup">By Admin</div>
            </div>
            <button class="vote-now-btn" onclick="window.location.href='voter.html'">Vote</button>
        </div>

        <!-- Yahan history dikhane ke liye tu aur cards daal sakta hai, par abhi simplify kiya hai -->
        
    </div>

    <script>
        // 1. Splash Screen Logic
        function openFeed() {
            const splash = document.getElementById('splash-screen');
            const feed = document.getElementById('main-feed');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                feed.style.display = 'block';
                document.body.style.overflow = 'auto'; 
                setTimeout(() => { feed.style.opacity = '1'; }, 100);
            }, 1000); 
        }

        // 2. Firebase Connection for Live Feed
        const firebaseConfig = { 
            databaseURL: "https://jbps-voting-app-64e09-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Listen for new acts from Admin Panel
        db.ref('currentAct').on('value', (snapshot) => {
            let act = snapshot.val();
            if(act && act.name) {
                // Jab naya act aayega toh Feed auto-update ho jayegi!
                document.getElementById('feedActTitle').innerText = act.name;
                document.getElementById('feedActGroup').innerText = act.group;
                
                // Agar act lock/reset kar diya admin ne
                if(act.name === "Waiting for next act...") {
                    document.getElementById('liveActCard').style.opacity = "0.5";
                } else {
                    document.getElementById('liveActCard').style.opacity = "1";
                }
            }
        });
    </script>
</body>
</html>
