<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ullas 2.0 - JBS Annual Function 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .top-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 40px;
            opacity: 0;
            animation: fadeIn 1.5s ease forwards;
        }

        .header-logo {
            width: 50px;
            background: white;
            padding: 5px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin: 0;
            letter-spacing: 1px;
        }

        .main-content {
            text-align: center;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .animated-jbs {
            font-size: 110px;
            font-weight: 900;
            margin-bottom: 0px;
            line-height: 1;
            background: linear-gradient(to right, #004e92, #000428, #004e92, #56ccf2, #004e92);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineSweep 3s linear infinite, popIn 1s ease forwards;
            opacity: 0;
        }

        .presents {
            font-size: 18px;
            color: #b2bec3;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .ullas-title {
            font-family: 'Yatra One', serif;
            font-size: 75px;
            margin: 0;
            padding: 10px;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(252, 246, 186, 0.3));
            animation: shineSweep 4s linear infinite, slideUp 1s ease 1.5s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .annual-year {
            font-size: 22px;
            color: #f1c40f;
            letter-spacing: 3px;
            margin-top: 5px;
            opacity: 0;
            animation: fadeIn 1s ease 2s forwards;
        }

        .enter-btn {
            display: inline-block;
            margin-top: 50px;
            padding: 16px 50px;
            background: linear-gradient(90deg, #f1c40f, #d4af37, #f1c40f);
            background-size: 200% auto;
            color: black;
            font-size: 20px;
            font-weight: bold;
            border-radius: 40px;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
            opacity: 0;
            animation: shineSweep 3s linear infinite, fadeIn 1s ease 2.5s forwards;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .enter-btn:active { 
            transform: scale(0.92); 
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        @keyframes shineSweep { to { background-position: 200% center; } }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="top-header">
        <img src="logo.png" alt="JBS Logo" class="header-logo">
        <h2 class="header-title">Jingle Bells Public School</h2>
    </div>

    <div class="main-content">
        <div class="animated-jbs">JBS</div>
        <div class="presents">Presents</div>
        
        <h1 class="ullas-title">उल्लास 2.0</h1>
        <div class="annual-year">ANNUAL FUNCTION 2026</div>
        
        <a id="enterBtn" class="enter-btn">Tap to Light Up ✨</a>
    </div>

    <!-- Firebase SDK Setup -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

        document.getElementById('enterBtn').addEventListener('click', function(e) {
            window.location.href = "engage.html";
        });
    </script>

</body>
    </html>
